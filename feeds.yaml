# ===== تنظیمات ربات =====
max_posts_per_run: 6      # حداکثر خبر در هر اجرا
first_run_posts: 4        # در اولین اجرا فقط این تعداد
max_age_hours: 6
channel_signature: "@khabarfurybot"   # امضای پایین هر پیام (خالی = بدون امضا)
link_preview: false      # پیش‌نمایش لینک
hashtags: true           # هشتگ دسته در انتهای پیام          # خبرهای قدیمی‌تر از این گذاشته نمی‌شوند

# دسته‌ها به ترتیب اولویت (عدد کمتر = مهم‌تر)
# include: حداقل یکی از این کلمات باید در عنوان/خلاصه باشد (برای فیدهای filter: true)
# exclude: اگر یکی از این کلمات بود، خبر رد می‌شود
categories:
  iran:
    priority: 1
    emoji: "🇮🇷"
    label: "ایران"
    include: [iran, iranian, tehran, khamenei, pezeshkian, araghchi, irgc, revolutionary guard, hormuz, persian gulf, isfahan, natanz, fordow]
    exclude: [iran's football, iranian league]
  war:
    priority: 2
    emoji: "⚔️"
    label: "جنگ و نظامی"
    include: [airstrike, air strike, airstrikes, strike, strikes, attack, attacks, attacked, killed, kills, dead, missile, missiles, drone strike, drones, offensive, ceasefire, truce, invasion, invade, shelling, frontline, front line, clashes, troops advance, fighting, bombing, bombed, war crimes, casualties, rebels, militants, insurgents, hostages, escalation, retaliation, intercepted, ground operation, siege]
    exclude: [collision, crash, accident, derailed, election, majority, parties, hate, cyberattack, heart attack, panic attack, contract, contracts, healthcare, health care, veterans, veteran, job fair, fair, procurement, budget, recruiting, recruitment, ceremony, ceremonies, awarded, award, hiring, employee, lawsuit, sues, leaked, classified, fired, museum, anniversary, football, soccer, cricket, tennis, nba, nfl, film, movie, review, recipe, stocks, shares]
  forex:
    priority: 3
    emoji: "💹"
    label: "فارکس و بازار"
    include: [forex, fx, dollar, euro, yen, pound, sterling, yuan, currency, currencies, fed, federal reserve, ecb, boj, boe, central bank, rate cut, rate hike, interest rate, inflation, cpi, jobs report, payrolls, gold, oil, brent, wti, crude, opec, treasury, yields, bitcoin, eur/usd, gbp/usd, usd/jpy, xau]
    exclude: [stock slides, ipo, earnings call, spacex]
  transfer:
    priority: 4
    emoji: "⚽️"
    label: "نقل_و_انتقالات"
    # برای فوتبال باید هم یک کلمهٔ نقل‌وانتقال باشد و هم اسم یک باشگاه یا بازیکن بزرگ
    include: [transfer, transfers, signs, signing, signed, joins, joined, join, deal, fee, loan, bid, agree, agreed, agreement, move, contract, here we go, medical, swoop, release clause, talks to sign, target, sell, sale, buy, approach, offer, permanent]
    require_also: [real madrid, barcelona, barca, man city, manchester city, man utd, man united, manchester united, liverpool, arsenal, chelsea, bayern, psg, paris saint-germain, juventus, inter milan, inter, ac milan, milan, atletico, tottenham, spurs, newcastle, dortmund, al nassr, al-nassr, al hilal, al-hilal, al ittihad, napoli, aston villa, leverkusen,
                   mbappe, haaland, vinicius, bellingham, salah, yamal, kane, rodrygo, osimhen, wirtz, musiala, saka, rice, palmer, isak, gyokeres, alvarez, lautaro, ronaldo, messi, neymar, de bruyne, fernandes, rashford, nunez, kvaratskhelia, guehi, semenyo]
    exclude: [women, "womens", wsl, u21, u23, academy, press conference, interview, manager, coach, boss, video, watch, highlights, "player ratings", preview, report, live, score, podcast, injury update, sacked, tactics, move forward, captain, captaincy]

# فیدها. categories: دسته‌هایی که این فید می‌تواند داشته باشد (به ترتیب بررسی)
